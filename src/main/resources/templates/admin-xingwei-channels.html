<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/><meta name="robots" content="noindex,nofollow"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="_csrf" th:content="${_csrf.token}"/><meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>渠道运营 · 星维管理后台</title>
  <link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261017search1"/>
  <link rel="stylesheet" href="/assets/admin-xingwei-channels.css?v=20261016v4n"/>
</head>
<body><main class="xwc-shell">
  <header class="xwc-header"><div><p class="xw-kicker">星维 · 渠道运营</p><h1>渠道运营</h1><p>查看服务状态，安排官网、淘宝与闲鱼的运营任务。</p></div><a class="xw-button xw-button-ghost" href="/admin/xingwei">返回后台</a></header>
  <p class="xwc-note">服务状态由运营人员维护，仅用于内部协作；不代表平台接口实时状态，也不会自动发布商品或更改前台接单开关。请勿填写账号密码、令牌或客户敏感信息。</p>
  <p id="channelMessage" role="status" aria-live="polite">正在读取渠道运营数据…</p>
  <button id="channelRetry" class="xw-button xw-button-ghost" type="button" hidden>重新读取</button>
  <section aria-label="渠道服务状态" id="channelStates" class="xwc-states"></section>
  <section class="xwc-tasks">
    <div class="xwc-heading"><h2>运营任务</h2><button id="channelNew" type="button" class="xw-button" hidden>新增任务</button></div>
    <form id="channelFilters" class="xwc-filters">
      <label>渠道<select id="xw-field-channel" name="channel"><option value="">全部渠道</option><option value="WEBSITE">官网</option><option value="TAOBAO">淘宝</option><option value="XIANYU">闲鱼</option></select></label>
      <label>状态<select id="xw-field-status" name="status"><option value="">全部状态</option><option value="TODO">待处理</option><option value="IN_PROGRESS">进行中</option><option value="DONE">已完成</option><option value="CANCELLED">已取消</option></select></label>
      <label class="xwc-search">搜索任务<input id="xw-field-q" name="q" maxlength="80" placeholder="标题或任务说明"/></label>
      <button type="submit" class="xw-button">查询</button><button id="channelRefresh" type="button" class="xw-button xw-button-ghost">刷新</button>
    </form>
    <p id="channelCount"></p><div id="channelTasks" class="xwc-list" aria-busy="true"></div>
    <nav class="xwc-pagination" aria-label="任务分页"><button id="channelPrev" type="button" class="xw-button xw-button-ghost" disabled>上一页</button><span id="channelPage">第 1 页</span><button id="channelNext" type="button" class="xw-button xw-button-ghost" disabled>下一页</button></nav>
  </section>
  <dialog id="channelTaskDialog"><form id="channelTaskForm">
    <div class="xwc-heading"><h2 id="channelTaskHeading">新增任务</h2><button type="button" data-close="task" aria-label="关闭任务编辑">关闭</button></div>
    <input name="id" type="hidden"/><input name="version" type="hidden"/>
    <label>任务标题<input name="title" maxlength="120" required/></label>
    <div class="xwc-form-grid"><label>渠道<select name="channelCode" required><option value="WEBSITE">官网</option><option value="TAOBAO">淘宝</option><option value="XIANYU">闲鱼</option></select></label>
    <label>状态<select name="status" required><option value="TODO">待处理</option><option value="IN_PROGRESS">进行中</option><option value="DONE">已完成</option><option value="CANCELLED">已取消</option></select></label>
    <label>负责人<select name="ownerAdminUserId" required></select></label><label>截止日期（可选）<input name="dueDate" type="date"/></label></div>
    <label>任务说明<textarea name="details" maxlength="2000" rows="5"></textarea></label>
    <p id="channelTaskFeedback" role="status" aria-live="polite"></p>
    <div class="xwc-actions"><button type="submit" class="xw-button">保存任务</button><button type="button" data-close="task" class="xw-button xw-button-ghost">取消编辑</button></div>
  </form></dialog>
  <dialog id="channelStateDialog"><form id="channelStateForm">
    <div class="xwc-heading"><h2 id="channelStateHeading">维护服务状态</h2><button type="button" data-close="state" aria-label="关闭状态编辑">关闭</button></div>
    <input name="channelCode" type="hidden"/><input name="version" type="hidden"/>
    <label>服务状态<select name="serviceState"><option value="UNKNOWN">待核对</option><option value="AVAILABLE">可接服务</option><option value="PAUSED">暂停接单</option></select></label>
    <label>状态说明<textarea name="note" maxlength="500" rows="4"></textarea></label>
    <p id="channelStateFeedback" role="status" aria-live="polite"></p>
    <div class="xwc-actions"><button type="submit" class="xw-button">保存状态</button><button type="button" data-close="state" class="xw-button xw-button-ghost">取消编辑</button></div>
  </form></dialog>
</main><script defer src="/assets/admin-xingwei-labels.js?v=20261017search1"></script><script src="/assets/admin-xingwei-channels.js?v=20261016v4n" defer></script></body></html>
