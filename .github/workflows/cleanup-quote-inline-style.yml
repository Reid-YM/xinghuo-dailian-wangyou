name: Cleanup Quote Inline Style

on:
  push:
    branches:
      - refactor/quote-style-ownership-20261012

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/quote-style-ownership-20261012
          fetch-depth: 0

      - name: Remove retired quote inline override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/resources/templates/quote.html')
          text = path.read_text(encoding='utf-8')
          block = '''  <style>\n    /* 询价页：一对一咨询卡片与报价卡片顶部对齐。\n       app.css 里 .consult-card{top:86px} 是历史偏移，这里做页面级覆盖，\n       避免为这几行去提升全局 app.css 的缓存版本号。 */\n    body[data-page="quote"] .quote-layout { align-items: start; }\n    body[data-page="quote"] .consult-card { top: 0; }\n  </style>\n'''
          if block not in text:
              raise SystemExit('quote inline style block not found')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          Path('.github/workflows/cleanup-quote-inline-style.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove quote inline style override"
          git push origin HEAD:refactor/quote-style-ownership-20261012
