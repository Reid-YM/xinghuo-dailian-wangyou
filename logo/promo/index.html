<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星火网游 · 宣传图</title>
<style>
  :root{
    --ink:#0A0C0F; --ink-2:#101319; --line:#242B35;
    --g1:#D89A00; --g2:#F0B000; --g3:#FFC928; --g4:#FFD24A; --gold:#F5B700;
    --text:#F2F4F7; --muted:#98A1AD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .stack{display:flex;flex-direction:column;gap:24px;padding:24px}
  canvas,.cv{display:block;position:relative;overflow:hidden;background:var(--ink);color:var(--text);flex:none}
  .cv::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.06);pointer-events:none}

  .label{font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .label b{color:var(--g3);font-weight:700}
  .rule{height:2px;background:linear-gradient(90deg,var(--gold),rgba(245,183,0,0));}
  .h1{font-weight:800;letter-spacing:-.02em;line-height:1.04}
  .sub{color:#C7CDD6;font-weight:500}
  .pts{display:flex;gap:10px}
  .pt{background:rgba(245,183,0,.08);border:1px solid rgba(245,183,0,.28);border-radius:999px;color:#FFE39A;font-weight:700;display:flex;align-items:center}
  .cta{background:var(--gold);color:#191203;font-weight:800;border-radius:999px;display:inline-flex;align-items:center}
  .url{color:var(--muted)}
  .mark{position:absolute}

  /* 1080 x 1080 */
  #square{width:1080px;height:1080px;padding:84px 88px}
  #square .h1{font-size:118px}
  #square .sub{font-size:30px;margin-top:26px;line-height:1.5}
  #square .pt{font-size:22px;padding:11px 22px}
  #square .cta{font-size:26px;padding:18px 38px}
  #square .mark{right:-70px;bottom:-40px;width:560px;opacity:.16}
  #square .rule{width:190px;margin:30px 0 34px}

  /* 1080 x 1920 story */
  #story{width:1080px;height:1920px;padding:120px 90px}
  #story .h1{font-size:128px}
  #story .sub{font-size:34px;margin-top:30px;line-height:1.55}
  #story .pt{font-size:24px;padding:12px 24px}
  #story .cta{font-size:30px;padding:22px 46px}
  #story .mark{left:50%;transform:translateX(-50%);top:230px;width:620px}
  #story .rule{width:210px;margin:36px 0 40px}

  /* 1920 x 1080 banner */
  #banner{width:1920px;height:1080px;padding:0}
  #banner .left{position:absolute;left:120px;top:50%;transform:translateY(-50%);width:940px}
  #banner .h1{font-size:104px}
  #banner .sub{font-size:29px;margin-top:24px;line-height:1.5}
  #banner .pt{font-size:21px;padding:10px 20px}
  #banner .cta{font-size:25px;padding:17px 36px}
  #banner .rule{width:180px;margin:28px 0 30px}
  #banner .mark{right:120px;top:50%;transform:translateY(-50%);width:660px}

  /* 1200 x 630 og */
  #og{width:1200px;height:630px;padding:0}
  #og .left{position:absolute;left:80px;top:50%;transform:translateY(-50%)}
  #og .mark{right:70px;top:50%;transform:translateY(-50%);width:330px}
  #og .h1{font-size:62px;margin-top:20px}
  #og .sub{font-size:20px;margin-top:16px}
  #og .url{font-size:19px;margin-top:26px}
  #og .rule{width:130px;margin:22px 0 0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tiers" viewBox="0 0 256 256">
    <rect x="29" y="164" width="36" height="62" rx="18" fill="#D89A00"/>
    <rect x="83" y="120" width="36" height="106" rx="18" fill="#F0B000"/>
    <rect x="137" y="76" width="36" height="150" rx="18" fill="#FFC928"/>
    <rect x="191" y="32" width="36" height="194" rx="18" fill="#FFD24A"/>
  </symbol>
</svg>

<div class="stack">

  <!-- 1080 x 1080 -->
  <div class="cv" id="square" data-shot="promo-square-1080">
    <svg class="mark" viewBox="0 0 256 256"><use href="#tiers" width="256" height="256"/></svg>
    <div class="label">XINGHUO GAMING · <b>星火网游</b></div>
    <div class="rule"></div>
    <div class="h1">游戏任务代练</div>
    <div class="sub">按进度报价 · 提交拿业务编号<br>进度随时可查</div>
    <div class="pts" style="margin-top:44px">
      <div class="pt">可靠手打</div>
      <div class="pt">纯绿服务</div>
      <div class="pt">一号到底</div>
    </div>
    <div style="margin-top:56px;display:flex;align-items:center;gap:24px">
      <div class="cta">提前询价</div>
      <div class="url" style="font-size:24px">wydlgf.cn</div>
    </div>
  </div>

  <!-- 1080 x 1920 -->
  <div class="cv" id="story" data-shot="promo-story-1080x1920">
    <svg class="mark" viewBox="0 0 256 256"><use href="#tiers" width="256" height="256"/></svg>
    <div style="position:absolute;left:90px;top:1010px;width:900px">
      <div class="label">XINGHUO GAMING</div>
      <div class="rule"></div>
      <div class="h1">游戏任务代练</div>
      <div class="sub">按进度报价 · 提交拿业务编号 · 进度可查</div>
      <div class="pts" style="margin-top:48px;flex-wrap:wrap">
        <div class="pt">可靠手打</div>
        <div class="pt">纯绿服务</div>
        <div class="pt">一号到底</div>
      </div>
    </div>
    <div style="position:absolute;left:90px;bottom:130px;display:flex;align-items:center;gap:26px">
      <div class="cta">提前询价</div>
      <div class="url" style="font-size:28px">wydlgf.cn</div>
    </div>
  </div>

  <!-- 1920 x 1080 -->
  <div class="cv" id="banner" data-shot="promo-banner-1920x1080">
    <div class="left">
      <div class="label">XINGHUO GAMING · <b>星火网游</b></div>
      <div class="rule"></div>
      <div class="h1">游戏任务代练</div>
      <div class="sub">按进度报价 · 提交拿业务编号 · 进度随时可查</div>
      <div class="pts" style="margin-top:38px">
        <div class="pt">可靠手打</div>
        <div class="pt">纯绿服务</div>
        <div class="pt">一号到底</div>
      </div>
      <div style="margin-top:46px;display:flex;align-items:center;gap:22px">
        <div class="cta">提前询价</div>
        <div class="url" style="font-size:22px">wydlgf.cn</div>
      </div>
    </div>
    <svg class="mark" viewBox="0 0 256 256"><use href="#tiers" width="256" height="256"/></svg>
  </div>

  <!-- 1200 x 630 -->
  <div class="cv" id="og" data-shot="promo-og-1200x630">
    <div class="left">
      <div class="label" style="font-size:13px">XINGHUO GAMING</div>
      <div class="h1">星火网游代练平台</div>
      <div class="sub">按进度报价 · 进度可查 · 网页不收账号密码</div>
      <div class="url">wydlgf.cn</div>
      <div class="rule"></div>
    </div>
    <svg class="mark" viewBox="0 0 256 256"><use href="#tiers" width="256" height="256"/></svg>
  </div>

</div>
</body>
</html>
