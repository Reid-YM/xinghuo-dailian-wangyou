<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>待跟进时效队列 · 星维管理后台</title>
  <link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261019cutover"/>
  <link rel="stylesheet" href="/assets/admin-xingwei-business.css?v=20261014v3x"/>
  <link rel="stylesheet" href="/assets/admin-xingwei-after-sales.css?v=20261016v4k"/>
  <script defer src="/assets/admin-xingwei-labels.js?v=20261017search1"></script><script defer src="/assets/admin-xingwei-after-sales-attention.js?v=20261016v4m"></script>
<link rel="icon" href="/assets/brand-logo.svg?v=20261019admin" type="image/svg+xml"/>
</head>
<body>
<main class="xwb-shell">
  <header class="xwb-topbar">
    <div><p class="xw-kicker"><img class="xw-workspace-logo" src="/assets/brand-logo.svg?v=20261019admin" alt="" width="26" height="26"/> 星维 · 售后跟进</p><h1>待跟进时效队列</h1></div>
    <div class="xwb-top-actions">
      <a class="xw-button xw-button-ghost" href="/admin/xingwei/after-sales/cases">返回售后处理</a>
      <a class="xw-button xw-button-ghost" href="/admin/xingwei">返回后台</a>
    </div>
  </header>

  <section class="xwb-hero">
    <div>
      <p class="xw-kicker">售后服务</p>
      <h2>直接查看客户已等待多久</h2>
      <p>按等待时长查看待跟进售后。客户有未确认的新补充时，从最新补充计时；其余待处理记录从提交时间计时。24 小时内、24–72 小时、72 小时以上为运营分档，可按时效、状态和问题类型筛选。</p>
    </div>
  </section>

  <form id="attentionFilters" class="xw-case-filters">
    <label>待跟进时效
      <select id="xw-field-age" name="age" required>
        <option value="ATTENTION">全部需跟进</option>
        <option value="WITHIN_24H">24 小时内</option>
        <option value="FROM_24_TO_72H">24–72 小时</option>
        <option value="OVER_72H">72 小时以上</option>
      </select>
    </label>
    <label>处理状态
      <select id="xw-field-status" name="status"><option value="">全部</option><option value="OPEN">待处理</option><option value="IN_PROGRESS">处理中</option><option value="RESOLVED">已解决</option></select>
    </label>
    <label>问题类型
      <select id="xw-field-category" name="category"><option value="">全部</option><option value="DELIVERY">交付或进度</option><option value="CANCELLATION">取消服务</option><option value="REFUND_REVIEW">退款核对</option><option value="OTHER">其他问题</option></select>
    </label>
    <label>客户补充
      <select id="xw-field-followup" name="followup"><option value="">全部</option><option value="PENDING">待跟进</option></select>
    </label>
    <label>优先顺序
      <select id="xw-field-sort" name="sort"><option value="NEWEST_FIRST">最新待跟进优先</option><option value="OLDEST_FIRST">最久未响应优先</option></select>
    </label>
    <label>搜索<input id="xw-field-q" name="q" maxlength="80" placeholder="业务编号、订单号或客户说明"/></label>
    <button class="xw-button" type="submit">查询</button>
  </form>

  <p id="attentionMessage" role="status">正在读取待跟进队列……</p>
  <section class="xw-data-panel xwb-panel" aria-label="待跟进时效队列">
    <div class="xw-table-wrap xw-table-tall">
      <table class="xw-table xwb-table">
        <thead><tr><th>业务编号</th><th>问题类型</th><th>客户说明</th><th>状态</th><th>最近客户活动</th><th>等待时长</th><th>操作</th></tr></thead>
        <tbody id="attentionRows"></tbody>
      </table>
    </div>
  </section>
  <div class="xw-case-pager">
    <button class="xw-button xw-button-ghost" id="attentionPrev" type="button">上一页</button>
    <span id="attentionPage"></span>
    <button class="xw-button xw-button-ghost" id="attentionNext" type="button">下一页</button>
  </div>
</main>
</body>
</html>
