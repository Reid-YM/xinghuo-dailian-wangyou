name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认把当前 main 发布到生产'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - deploy/production

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: One-click production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Validate production request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              [ "${GITHUB_REF}" = "refs/heads/main" ] || {
                echo "Production deploy is only allowed from main. Current ref: ${GITHUB_REF}"
                exit 1
              }
              [ "${{ inputs.confirm }}" = "true" ] || {
                echo "Production deploy confirmation was not checked."
                exit 1
              }
              deploy_sha="${GITHUB_SHA}"
              ;;
            push)
              [ "${GITHUB_REF}" = "refs/heads/deploy/production" ] || {
                echo "Automated production deploy is only allowed from deploy/production. Current ref: ${GITHUB_REF}"
                exit 1
              }

              parent_count=$(git rev-list --parents -n 1 "${GITHUB_SHA}" | wc -w)
              [ "${parent_count}" -eq 2 ] || {
                echo "::error::Production deployment blocked: deploy request must be a normal one-parent commit."
                exit 1
              }

              request_parent=$(git rev-parse "${GITHUB_SHA}^")
              changed_files=$(git diff --name-only "${request_parent}" "${GITHUB_SHA}")
              [ "${changed_files}" = ".deploy-request" ] || {
                echo "::error::Production deployment blocked: request commit may only change .deploy-request."
                printf 'Changed files:\n%s\n' "${changed_files}"
                exit 1
              }

              [ -f .deploy-request ] || {
                echo "::error::Production deployment blocked: .deploy-request is missing."
                exit 1
              }
              deploy_sha_count=$(grep -c '^deploy_sha=' .deploy-request || true)
              [ "${deploy_sha_count}" -eq 1 ] || {
                echo "::error::Production deployment blocked: .deploy-request must contain exactly one deploy_sha entry."
                exit 1
              }
              deploy_sha=$(sed -n 's/^deploy_sha=//p' .deploy-request | head -n 1 | tr -d '[:space:]')
              [[ "${deploy_sha}" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::Production deployment blocked: invalid deploy_sha in .deploy-request."
                exit 1
              }

              main_sha=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                | jq -r '.object.sha')
              [ "${deploy_sha}" = "${main_sha}" ] || {
                echo "::error::Production deployment blocked: deploy_sha must equal current main."
                echo "request target: ${deploy_sha}"
                echo "main: ${main_sha}"
                exit 1
              }
              ;;
            *)
              echo "Unsupported production deploy event: ${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

          echo "DEPLOY_SHA=${deploy_sha}" >> "${GITHUB_ENV}"
          echo "Target SHA: ${deploy_sha}"

      - name: Require merged Pull Request origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/pulls"
          prs=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")

          echo "$prs" | jq -e --arg sha "$DEPLOY_SHA" '
            any(.[];
              .merged_at != null
              and .base.ref == "main"
              and .merge_commit_sha == $sha
            )
          ' >/dev/null || {
            echo "::error::Production deployment blocked: current target commit was not merged through a GitHub Pull Request."
            exit 1
          }

          echo "PASS: deployment target came from a merged Pull Request."

      - name: Require successful main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&event=push&per_page=10"
          json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          echo "$json" | jq -e '
            .workflow_runs
            | any(.status == "completed" and .conclusion == "success")
          ' >/dev/null || {
            echo "No successful main CI run found for ${DEPLOY_SHA}."
            exit 1
          }
          echo "Main CI is successful for ${DEPLOY_SHA}."

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-from-github.sh
          bash -n scripts/github-deploy-gateway.sh
          bash -n scripts/install-github-deploy-bridge.sh
          bash -n scripts/deploy-zero-downtime.sh
          bash -n scripts/smoke_test.sh

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$PROD_SSH_HOST" ] || { echo "Missing PROD_SSH_HOST"; exit 1; }
          [ -n "$PROD_SSH_PRIVATE_KEY" ] || { echo "Missing PROD_SSH_PRIVATE_KEY"; exit 1; }
          [ -n "$PROD_SSH_KNOWN_HOSTS" ] || { echo "Missing PROD_SSH_KNOWN_HOSTS"; exit 1; }

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy current main to production
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            "ubuntu@${PROD_SSH_HOST}" \
            "deploy ${DEPLOY_SHA}"
