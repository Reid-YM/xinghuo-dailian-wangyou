name: Cleanup Retired UI Fixes

on:
  push:
    branches:
      - refactor/remove-ui-fixes-references-20261012

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-ui-fixes-references-20261012
          fetch-depth: 0

      - name: Remove retired ui-fixes references and asset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          templates = Path('src/main/resources/templates')
          pattern = re.compile(r'<script\s+defer\s+src="/assets/ui-fixes\.js\?v=[^"]+"></script>')
          changed = []

          for path in sorted(templates.glob('*.html')):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub('', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          leftovers = []
          for path in sorted(templates.glob('*.html')):
              if '/assets/ui-fixes.js' in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('leftover template refs: ' + ', '.join(leftovers))

          asset = Path('src/main/resources/static/assets/ui-fixes.js')
          if asset.exists():
              asset.unlink()

          workflow = Path('.github/workflows/cleanup-retired-ui-fixes.yml')
          if workflow.exists():
              workflow.unlink()

          print('Removed refs from:')
          print('\n'.join(changed) if changed else '(none)')
          PY

      - name: Commit mechanical cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove retired ui-fixes references"
          git push origin HEAD:refactor/remove-ui-fixes-references-20261012
