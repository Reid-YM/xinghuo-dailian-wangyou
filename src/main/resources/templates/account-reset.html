<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090c">
  <title>重置密码 - 星火网游代练平台</title>
  <meta name="description" content="通过邮箱验证码重置星火网游代练平台账号密码。验证码 30 分钟内有效且只能使用一次。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://wydlgf.cn/account/reset"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/app.css?v=20261005v031"><link rel="stylesheet" href="/assets/account.css?v=20261006ac16">
  <script defer src="/assets/ui-fixes.js?v=20261008audit01"></script><script defer src="/assets/site-image-controls.js?v=20261008r2"></script><script defer src="/assets/public.js?v=20261008r2"></script><script defer src="/assets/account.js?v=20261006ac19"></script>
<link rel="stylesheet" href="/assets/site-image-controls.css?v=20261008r2"/>
</head>
<body data-page="account-reset">
<header th:replace="~{fragments/site :: header}"></header>
<main class="container section auth-shell">
  <section class="auth-value-panel">
    <span class="eyebrow">账号安全</span>
    <h1>设置一个新密码，随后所有设备都会退出登录。</h1>
    <p>重置验证码只能使用一次，30 分钟后失效。为保护账号，重置成功后已登录的手机与电脑会被全部下线，需要用新密码重新登录。</p>
    <div class="auth-value-grid">
      <div><strong>用后即废</strong><span>验证码一旦提交即失效，重复提交会提示过期。</span></div>
      <div><strong>全端下线</strong><span>重置会撤销所有设备的登录状态。</span></div>
      <div><strong>不收密码</strong><span>网页永远不索取游戏账号密码、验证码或令牌。</span></div>
    </div>
    <div class="detail-list">
      <strong>验证码失效了</strong><span>回到登录页重新发送一次验证码即可。</span>
      <strong>需要帮助</strong><span>始终可以通过客服渠道人工核实身份。</span>
    </div>
  </section>

  <section class="auth-card card" aria-labelledby="resetTitle">
    <div class="auth-card-head">
      <span class="eyebrow">重置密码</span>
      <h2 id="resetTitle">设置新密码</h2>
      <p class="muted">新密码至少 8 位，需包含字母、数字、符号中的至少两类。</p>
    </div>

    <form id="accountResetConfirmForm" class="account-form" novalidate>
      <div class="field">
        <label for="resetEmailConfirm">绑定邮箱</label>
        <input id="resetEmailConfirm" name="email" type="email" autocomplete="email" required maxlength="190" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="resetCode">邮箱验证码</label>
        <input id="resetCode" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="6" placeholder="6 位数字验证码">
      </div>
      <div class="field">
        <label for="resetNewPassword">新密码</label>
        <div class="password-field">
          <input id="resetNewPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="至少 8 位，两类以上字符">
          <button class="password-toggle" type="button" data-toggle-password aria-pressed="false" aria-label="显示密码">显示</button>
        </div>
      </div>

      <div class="field">
        <label for="resetConfirmPassword">确认新密码</label>
        <div class="password-field">
          <input id="resetConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="72" placeholder="再次输入新密码">
          <button class="password-toggle" type="button" data-toggle-password aria-pressed="false" aria-label="显示密码">显示</button>
        </div>
      </div>

      <div id="accountResetConfirmMsg" class="notice hidden" role="status" hidden></div>

      <button class="btn primary auth-submit" type="submit" data-submit>确认重置</button>
    </form>

    <div class="auth-card-foot">
      <a href="/account/login">返回登录</a>
      <a href="/contact">联系客服</a>
    </div>
  </section>
</main>
<nav class="mobile-dock" data-smart-dock aria-label="手机快捷操作"><a href="/">首页</a><a href="/records">业务记录</a><a class="primary" href="/quote" data-primary-cta>提前询价</a></nav>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
