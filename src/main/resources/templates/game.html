<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090c">
  <title th:text="${game.seoTitle ?: game.name + ' 游戏任务服务 | 星火网游代练平台'}">游戏任务服务 - 星火网游代练平台</title>
  <meta name="description" th:content="${game.seoDescription ?: game.name + ' 任务代练、活动、等级、排位等服务，提交需求获取业务编号，客服一对一确认报价。'}" content="星火网游代练平台游戏任务服务。">
  <link rel="canonical" th:href="${canonicalUrl}" href="https://wydlgf.cn/game/cod-mw4">
  <meta property="og:type" content="website"><meta property="og:site_name" content="星火网游代练平台">
  <meta property="og:title" th:content="${game.seoTitle ?: game.name + ' 游戏任务服务 | 星火网游代练平台'}" content="游戏任务服务 - 星火网游代练平台">
  <meta property="og:description" th:content="${game.seoDescription ?: game.description}" content="星火网游代练平台游戏任务服务。">
  <meta property="og:url" th:content="${canonicalUrl}" content="https://wydlgf.cn/game/cod-mw4">
  <meta property="og:image" th:content="${gameOgImage}" content="https://wydlgf.cn/og.png">
  <!-- SEO-K(Java 侧生成)：游戏页 BreadcrumbList（首页 > 服务大厅 > 游戏） -->
  <script type="application/ld+json" th:utext="${breadcrumbJsonLd}"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/app.css?v=20261005v031"><script defer src="/assets/ui-fixes.js?v=20261008audit01"></script><script defer src="/assets/site-image-controls.js?v=20261008r2"></script><script defer src="/assets/public.js?v=20261008r2"></script><script defer src="/assets/pages.js?v=20260928v016"></script>
<link rel="stylesheet" href="/assets/site-image-controls.css?v=20261008r2"/>
</head>
<body data-page="game">
<header th:replace="~{fragments/site :: header}"></header>
<main class="container section page-shell">
  <section class="page-hero detail-hero">
    <div>
      <span class="eyebrow" th:text="${game.nameEn ?: 'Game'}">Game</span>
      <h1 th:text="${game.name + ' 任务服务'}">游戏任务服务</h1>
      <p th:text="${game.description ?: game.genres ?: '选择服务项目，提交需求后由客服确认报价。'}">选择服务项目，提交需求后由客服确认报价。</p>
      <div class="trust"><span th:text="${game.publisher ?: '官方平台'}">官方平台</span><span th:text="${game.genres ?: '游戏任务'}">游戏任务</span><span>网页不收密码</span><span>业务编号可查</span></div>
    </div>
    <img th:if="${game.coverImage != null}" th:src="${game.coverImage}" th:alt="${game.name}" src="/og.png" alt="游戏封面" width="800" height="450" loading="eager" decoding="async">
  </section>
  <section class="section">
    <div class="section-title"><div><span class="eyebrow">服务项目</span><h2 th:text="${game.name + ' 可接服务'}">可接服务</h2></div><a class="text-link" href="/services">全部服务</a></div>
    <div class="grid4">
      <a class="service-card card" th:each="s : ${gameServices}" th:href="@{/service/{slug}(slug=${s.slug})}">
        <div class="service-cover" th:if="${s.coverImage != null}"><img th:src="${s.coverImage}" th:alt="${s.name}" loading="lazy" width="640" height="360"></div>
        <div class="service-cover service-fallback-icon" th:if="${s.coverImage == null}"><svg class="ui-icon"><use href="/assets/icons.svg#i-service"></use></svg></div>
        <div class="service-card-head"><span class="tag" th:text="${s.category}">服务</span><span class="availability" th:text="${acceptingOrders and s.status.name() == 'AVAILABLE' ? '可接单' : (s.status.name() == 'OFFLINE' ? '已下架' : '可预约')}">可预约</span></div>
        <h3 th:text="${s.name}">服务名称</h3>
        <p class="muted clamp2" th:text="${s.shortDesc}">服务说明</p>
        <div class="service-meta"><strong th:text="${s.priceMode.name() == 'FIXED' ? '¥' + #numbers.formatDecimal(s.priceFixed,1,0) : (s.priceMode.name() == 'RANGE' ? '参考 ¥' + #numbers.formatDecimal(s.priceMin,1,0) + '–' + #numbers.formatDecimal(s.priceMax,1,0) : (s.priceMin != null ? '参考 ¥' + #numbers.formatDecimal(s.priceMin,1,0) + ' 起' : '按进度报价'))}">按进度报价</strong><span th:text="${s.durationText}">按进度确认</span></div>
      </a>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
<nav class="mobile-dock" aria-label="手机快捷操作"><a href="/">首页</a><a href="/services">服务</a><a href="/guides">攻略</a><a href="/mastery">MW4 工具站</a><a class="primary" href="/quote" data-primary-cta>提前询价</a></nav>
</body>
</html>
