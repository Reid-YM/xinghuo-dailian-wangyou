name: Refactor Global UI Event Sync

on:
  push:
    branches:
      - refactor/global-ui-event-sync-20261012

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-ui-event-sync-20261012
          fetch-depth: 0

      - name: Replace timer retries with explicit drawer lifecycle event
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          shell_path = Path('src/main/resources/static/assets/site-shell.js')
          shell = shell_path.read_text(encoding='utf-8')
          shell = once(
              shell,
              "      drawer.replaceChildren(list);\n",
              "      drawer.replaceChildren(list);\n      document.dispatchEvent(new CustomEvent('xh:mobile-nav-rendered', { detail: { drawer } }));\n",
              'drawer replace')
          shell_path.write_text(shell, encoding='utf-8')

          controls_path = Path('src/main/resources/static/assets/global-ui-controls.js')
          controls = controls_path.read_text(encoding='utf-8')
          controls = once(
              controls,
              "  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];\n",
              "  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];\n  let currentSettings = null;\n  let currentSite = null;\n",
              'control state')
          controls = once(
              controls,
              "  async function load() {\n",
              "  function reapplySharedNavigation() {\n    if (!currentSettings || !currentSite) return;\n    applySharedNavigation(currentSettings, currentSite);\n  }\n\n  async function load() {\n",
              'reapply helper')
          controls = once(
              controls,
              "      const settings = settingsResponse.ok ? await settingsResponse.json() : {};\n      const site = siteResponse.ok ? await siteResponse.json() : {};\n      applySharedNavigation(settings || {}, site || {});\n      applyPageControls(settings || {}, site || {});\n      setTimeout(() => applySharedNavigation(settings || {}, site || {}), 120);\n      setTimeout(() => applySharedNavigation(settings || {}, site || {}), 600);\n",
              "      currentSettings = settingsResponse.ok ? await settingsResponse.json() : {};\n      currentSite = siteResponse.ok ? await siteResponse.json() : {};\n      reapplySharedNavigation();\n      applyPageControls(currentSettings, currentSite);\n",
              'timer retries')
          controls = once(
              controls,
              "  protectUserCenterFromAdminLinks();\n",
              "  protectUserCenterFromAdminLinks();\n  document.addEventListener('xh:mobile-nav-rendered', reapplySharedNavigation);\n",
              'event listener')
          controls_path.write_text(controls, encoding='utf-8')

          fragment_path = Path('src/main/resources/templates/fragments/site.html')
          fragment = fragment_path.read_text(encoding='utf-8')
          fragment = once(fragment, 'site-shell.js?v=20261012ss05', 'site-shell.js?v=20261012ss06', 'site shell version')
          fragment = once(fragment, 'global-ui-controls.js?v=20261007g005', 'global-ui-controls.js?v=20261012g006', 'global controls version')
          fragment_path.write_text(fragment, encoding='utf-8')

          test_path = Path('src/test/java/com/xinghuo/web/GlobalUiControlContractTest.java')
          test = test_path.read_text(encoding='utf-8')
          test = once(test, '/assets/global-ui-controls.js?v=20261007g005', '/assets/global-ui-controls.js?v=20261012g006', 'test version')
          anchor = '        assertTrue(controls.contains("protectUserCenterFromAdminLinks"));\n'
          test = once(
              test,
              anchor,
              anchor + '        assertTrue(controls.contains("xh:mobile-nav-rendered"));\n        assertTrue(!controls.contains("setTimeout("), "global navigation controls must use explicit lifecycle events, not timer retries");\n',
              'contract assertions')
          test_path.write_text(test, encoding='utf-8')

          style_test_path = Path('src/test/java/com/xinghuo/web/FrontendStyleLayerContractTest.java')
          style_test = style_test_path.read_text(encoding='utf-8')
          style_test = once(style_test, 'site-shell.js?v=20261012ss05', 'site-shell.js?v=20261012ss06', 'style test shell version')
          style_test_path.write_text(style_test, encoding='utf-8')

          Path('.github/workflows/refactor-global-ui-event-sync.yml').unlink()
          PY

      - name: Commit event-driven sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: sync mobile navigation controls by event"
          git push origin HEAD:refactor/global-ui-event-sync-20261012
