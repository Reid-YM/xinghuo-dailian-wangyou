<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><meta name="_csrf" th:content="${csrf.token}"/><meta name="_csrf_header" th:content="${csrf.headerName}"/><title>订单报价与微信收款 · 星维后台</title><link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261019cutover"/><link rel="stylesheet" href="/assets/admin-xingwei-integrations.css?v=20261014v3p"/><link rel="stylesheet" href="/assets/admin-xingwei-payments.css?v=20261016payment1"/><script defer src="/assets/admin-xingwei-labels.js?v=20261017search1"></script><script defer src="/assets/admin-xingwei-payments.js?v=20261019cutover"></script><link rel="icon" href="/assets/brand-logo.svg?v=20261019admin" type="image/svg+xml"/>
<link rel="stylesheet" href="/assets/admin-device-layout.css?v=20261021visual2"/>
</head><body><main class="xwi-shell">
<header class="xwi-top"><div><p class="xw-kicker"><img class="xw-workspace-logo" src="/assets/brand-logo.svg?v=20261019admin" alt="" width="26" height="26"/> 订单报价与微信收款</p><h1>订单报价与微信收款</h1><p>先读取履约订单，核对客户归属与最终金额，再建立待支付单。客户扫码成功并通过微信回调验签后才视为到账。</p></div><div class="xwi-actions"><a class="xw-button" href="/admin/xingwei/integrations">支付配置状态</a><a class="xw-button xw-button-ghost" href="/admin/xingwei/business?tab=orders">订单工作台</a><a class="xw-button xw-button-ghost" href="/admin/xingwei">返回新版后台</a></div></header>
<p id="paymentMessage" role="status" aria-live="polite">正在读取支付权限…</p>
<section class="xwi-card" id="paymentPrepare" hidden><h2>确认最终报价并开放支付</h2><p>这里不是自动定价。客服与客户确认最终报价后，录入准确金额和服务名称，再建立待支付单；二维码出现不代表到账。</p><p id="paymentPreparePermission" role="status" aria-live="polite">正在核对收款开关和当前账号权限…</p><form id="paymentOrderLookup"><label>订单号或业务编号<input id="paymentOrderIdentifier" maxlength="80" required/></label><button class="xw-button" type="submit">读取订单</button></form><div id="paymentOrderDetails"></div>
<form id="paymentPrepareForm" hidden><fieldset id="paymentPrepareFields"><label>客服确认金额（人民币）<input id="paymentAmount" type="number" min="0.01" max="9999999.99" step="0.01" required/></label><label>服务名称<input id="paymentSubject" maxlength="127" required/></label><input id="paymentReason" type="hidden" value="客服已确认最终服务范围与金额"/><button id="paymentPrepareSubmit" class="xw-button" type="submit">确认金额并建立待支付单</button></fieldset></form><p id="paymentPrepareMessage" role="status" aria-live="polite"></p></section>
<section class="xwi-card"><h2>网站微信支付记录</h2><form id="paymentFilters"><label>搜索<input id="xw-field-q" name="q" maxlength="100" placeholder="支付单、业务编号或服务"/></label><button class="xw-button" type="submit">查询</button><button id="paymentRefresh" class="xw-button xw-button-ghost" type="button">刷新</button></form><div id="paymentRows" aria-busy="true"></div><div class="xwi-actions"><button id="paymentPrev" class="xw-button" type="button">上一页</button><span id="paymentPage"></span><button id="paymentNext" class="xw-button" type="button">下一页</button></div></section>
</main></body></html>
