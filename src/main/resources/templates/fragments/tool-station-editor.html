<section class="hidden" data-panel="toolStation" th:fragment="editor" xmlns:th="http://www.thymeleaf.org" th:class="${xingweiToolMode == true} ? '' : 'hidden'">
  <div class="admin-toolbar"><div><span class="eyebrow">武器与迷彩资料</span><h2>武器与迷彩资料</h2><p class="muted small">维护前台工具站的枪械资料、解锁条件、在线迷彩图片和三种模式预览图。保存后前台立即读取后台数据。</p></div><div class="row-actions"><a class="btn ghost" href="/mastery" target="_blank" rel="noopener">预览前台</a><button class="btn ghost" id="toolStationRefresh" type="button">刷新</button><button class="btn ghost" id="toolStationReset" type="button">恢复内置</button><button class="btn primary" id="toolStationSaveAll" type="button">保存全部</button></div></div>
  <div class="tool-admin-layout">
    <aside class="card tool-admin-sidebar"><div class="field"><label>搜索武器</label><input id="toolStationSearch" placeholder="输入武器名称"/></div><div id="toolStationWeaponList" class="tool-admin-weapon-list"></div></aside>
    <div class="card tool-admin-editor"><form id="toolStationForm"><input name="weaponCode" type="hidden"/>
      <div class="tool-admin-heading"><div><span class="eyebrow">武器资料</span><h2 id="toolStationWeaponTitle">请选择武器</h2></div><button class="btn primary" type="submit">保存当前武器</button></div>
      <div class="grid3"><input id="xw-field-code" name="code" type="hidden"/><div class="field"><label>武器名称</label><input id="xw-field-name" name="name" maxlength="80" required/></div><div class="field"><label>武器类型</label><input id="xw-field-weaponType" name="weaponType" maxlength="40" required/></div></div>
      <div class="grid3"><div class="field"><label>解锁说明</label><input id="xw-field-unlockLabel" name="unlockLabel" maxlength="100"/></div><div class="field"><label>玩家等级</label><input id="xw-field-unlockPlayerRank" name="unlockPlayerRank" type="number" min="0"/></div><div class="field"><label>最大等级</label><input id="xw-field-maxLevel" name="maxLevel" type="number" min="1"/></div></div>
      <div class="grid3 tool-admin-switches"><label class="toggle-row"><input id="xw-field-levelingEnabled" name="levelingEnabled" type="checkbox"/><span><b>启用武器等级</b><small>前台显示等级进度。</small></span></label><label class="toggle-row"><input id="xw-field-gunsmith" name="gunsmith" type="checkbox"/><span><b>支持枪械改装</b><small>控制枪械配置提示。</small></span></label><div class="field"><label>武器备注</label><input id="xw-field-note" name="note" maxlength="160"/></div></div>
      <div class="field"><label>Apex 配件（每行一个）</label><textarea id="xw-field-apexAttachments" name="apexAttachments" maxlength="1000"></textarea></div>
      <section class="tool-admin-block"><div class="tool-admin-block-head"><div><b>迷彩模式预览图</b><small>三种模式各一张，前台显示在模式切换区。</small></div></div><div class="grid3" id="toolStationModeImages"></div></section>
      <section class="tool-admin-block"><div class="tool-admin-block-head"><div><b>迷彩条件</b><small>当前武器的战区和迷彩条件。</small></div></div><div id="toolStationCamos" class="tool-camo-admin-list"></div></section>
      <section class="tool-admin-block"><div class="tool-admin-block-head"><div><b>在线迷彩图片</b><small>当前武器已录入的在线迷彩资料。</small></div></div><div id="toolStationOnlineCamos" class="tool-online-admin-list"></div></section>
    </form></div>
  </div>
</section>
