<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <meta name="robots" content="noindex,follow">
  <title th:text="${supportTopic.title + ' - 星火网游代练平台'}">在线咨询 - 星火网游代练平台</title>
  <meta name="description" th:content="${supportTopic.description}" content="联系星火客服进行在线咨询。">
  <link rel="stylesheet" href="/assets/app.css?v=20261005v031">
  <script defer src="/assets/ui-fixes.js?v=20261005uf19"></script>
  <script defer src="/assets/public.js?v=20261006pub11"></script>
  <style>
    .support-shell{max-width:980px;padding-top:34px;padding-bottom:72px}
    .support-card{overflow:hidden;padding:0;border:1px solid rgba(255,207,51,.18);background:linear-gradient(145deg,#0e1117 0%,#0a0c10 58%,#101317 100%)}
    .support-hero{padding:34px 34px 24px;border-bottom:1px solid rgba(255,255,255,.07);background:radial-gradient(circle at 85% 10%,rgba(255,207,51,.12),transparent 34%)}
    .support-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:26px;color:#aeb4bf;text-decoration:none;font-size:13px;font-weight:700}
    .support-back:hover{color:#ffcf33}
    .support-eyebrow{display:block;margin-bottom:8px;color:#ffcf33;font-size:12px;font-weight:800;letter-spacing:.12em}
    .support-title-row{display:flex;align-items:center;gap:14px}
    .support-icon{display:grid;place-items:center;width:52px;height:52px;border:1px solid rgba(255,207,51,.25);border-radius:16px;background:rgba(255,207,51,.09);font-size:26px}
    .support-title-row h1{margin:0;color:#fff;font-size:clamp(30px,5vw,48px);line-height:1.08}
    .support-description{max-width:720px;margin:18px 0 0;color:#b9c0ca;font-size:16px;line-height:1.8}
    .support-content{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr);gap:22px;padding:26px 34px 30px}
    .support-prep,.support-action{border:1px solid rgba(255,255,255,.07);border-radius:18px;background:#11151b;padding:22px}
    .support-prep h2,.support-action h2{margin:0 0 14px;color:#fff;font-size:17px}
    .support-checklist{display:grid;gap:12px;margin:0;padding:0;list-style:none}
    .support-checklist li{position:relative;padding:13px 14px 13px 42px;border-radius:13px;background:#171b22;color:#d5d8de;font-size:14px;line-height:1.55}
    .support-checklist li::before{content:'✓';position:absolute;left:14px;top:13px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,207,51,.12);color:#ffcf33;font-size:12px;font-weight:900}
    .support-action{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#151920,#101318)}
    .support-action p{margin:0 0 18px;color:#aeb5c0;font-size:13px;line-height:1.7}
    .support-action .btn{width:100%;justify-content:center;min-height:48px;font-weight:900}
    .support-safe{display:block;margin-top:12px;color:#7f8793;font-size:11px;line-height:1.6;text-align:center}
    .support-switch-wrap{padding:0 34px 34px}
    .support-switch-title{display:block;margin-bottom:10px;color:#818894;font-size:11px;font-weight:800;letter-spacing:.08em}
    .support-switch{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
    .support-switch a{display:flex;align-items:center;gap:8px;min-height:46px;padding:10px 12px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#101319;color:#b8bec8;text-decoration:none;font-size:13px;font-weight:800}
    .support-switch a:hover,.support-switch a.active{border-color:rgba(255,207,51,.42);background:#171a20;color:#fff}
    .support-switch a.active{box-shadow:inset 0 0 0 1px rgba(255,207,51,.08)}
    @media (max-width:760px){.support-shell{padding-top:18px;padding-bottom:96px}.support-hero{padding:24px 20px 20px}.support-back{margin-bottom:20px}.support-icon{width:46px;height:46px;border-radius:14px;font-size:23px}.support-content{grid-template-columns:1fr;padding:20px}.support-switch-wrap{padding:0 20px 24px}.support-switch{grid-template-columns:1fr 1fr}.support-switch a{min-height:44px}.support-description{font-size:14px}}
  </style>
</head>
<body data-page="support">
<header th:replace="~{fragments/site :: header}"></header>
<main class="container section support-shell">
  <section class="card support-card">
    <div class="support-hero">
      <a class="support-back" href="/contact">← 返回客服中心</a>
      <span class="support-eyebrow">专属客服入口</span>
      <div class="support-title-row">
        <span class="support-icon" aria-hidden="true" th:text="${supportTopic.icon}">💬</span>
        <h1 th:text="${supportTopic.title}">在线咨询</h1>
      </div>
      <p class="support-description" th:text="${supportTopic.description}">告诉客服你的需求，我们会继续确认。</p>
    </div>

    <div class="support-content">
      <article class="support-prep">
        <h2>进入客服前，建议先准备</h2>
        <ul class="support-checklist">
          <li th:each="item : ${supportTopic.checklist}" th:text="${item}">说明你的需求</li>
        </ul>
      </article>
      <aside class="support-action">
        <h2 th:text="${supportTopic.title + '入口'}">客服入口</h2>
        <p th:text="${supportTopic.tip}">把关键信息一次说明。</p>
        <a class="btn primary" th:href="@{'/customer-service/start/' + ${supportTopic.slug}}" data-track="online_support_start" th:text="${supportTopic.actionLabel}">开始在线咨询</a>
        <span class="support-safe">进入后可继续发送文字、图片或文件。<span data-global-ui="customer-service-safety">请勿发送账号密码、验证码或令牌。</span></span>
      </aside>
    </div>

    <div class="support-switch-wrap">
      <span class="support-switch-title">其他客服入口</span>
      <nav class="support-switch" aria-label="切换咨询类型">
        <a th:each="item : ${supportTopics}"
           th:href="@{'/support/' + ${item.slug}}"
           th:classappend="${item.slug == supportTopic.slug} ? ' active' : ''">
          <span aria-hidden="true" th:text="${item.icon}">💬</span>
          <span th:text="${item.title}">咨询</span>
        </a>
      </nav>
    </div>
  </section>
</main>
<nav class="mobile-dock" aria-label="手机快捷操作"><a href="/">首页</a><a href="/records">业务记录</a><a class="primary" href="/quote" data-primary-cta>提前询价</a></nav>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
