<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>闲鱼背景图</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1b1f25;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .stack{display:flex;flex-direction:column;gap:22px;padding:22px}
  .cv{position:relative;width:1200px;height:600px;overflow:hidden;background:#0A0C0F;flex:none;color:#F2F4F7}
  .cv::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.07);pointer-events:none}
  .micro{font-size:15px;letter-spacing:.34em;color:#B9842A;font-weight:600}
  .h1{font-weight:800;letter-spacing:-.01em;line-height:1.08}
  .sub{color:#A8B0BB}
  .pills{display:flex;gap:12px}
  .pill{border:1px solid rgba(245,183,0,.32);background:rgba(245,183,0,.08);color:#FFDE94;
        border-radius:999px;padding:9px 20px;font-size:19px;font-weight:600;white-space:nowrap}
  .mark{position:absolute;display:block}
  .hairline{position:absolute;background:linear-gradient(90deg,rgba(245,183,0,.7),rgba(245,183,0,0))}

  /* 安全区提示（导出前会隐藏） */
  .guide{position:absolute;pointer-events:none;border:1px dashed rgba(255,255,255,.14)}
</style>
</head>
<body>

<div class="stack">

  <!-- A：左文右标 -->
  <div class="cv" data-shot="xianyu-bg-a-left">
    <svg class="mark" style="right:-40px;top:60px;width:520px;height:480px;opacity:.9" viewBox="0 0 256 256">
      <path fill="#FFD24A" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
      <path fill="#D89A00" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
    </svg>
    <div style="position:absolute;left:88px;top:150px">
      <div class="micro">XINGHUO GAMING</div>
      <div class="h1" style="font-size:66px;margin-top:16px">游戏任务服务</div>
      <div class="sub" style="font-size:24px;margin-top:18px">可靠手打 · 纯绿服务 · 一号到底</div>
      <div class="pills" style="margin-top:30px">
        <div class="pill">MW4</div>
        <div class="pill">战狗</div>
        <div class="pill">CS2</div>
        <div class="pill">无畏契约</div>
      </div>
    </div>
    <div class="hairline" style="left:88px;top:126px;width:210px;height:2px"></div>
  </div>

  <!-- B：居中 -->
  <div class="cv" data-shot="xianyu-bg-b-center">
    <svg class="mark" style="left:50%;transform:translateX(-50%);top:96px;width:180px;height:180px" viewBox="0 0 256 256">
      <path fill="#FFD24A" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
      <path fill="#D89A00" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
    </svg>
    <div style="position:absolute;left:0;right:0;top:322px;text-align:center">
      <div class="h1" style="font-size:44px">可靠手打 · 纯绿服务 · 进度可查</div>
    </div>
    <div style="position:absolute;left:0;right:0;top:418px;display:flex;justify-content:center;gap:12px">
      <div class="pill">按进度报价</div>
      <div class="pill">客服一对一</div>
      <div class="pill">担保交易</div>
    </div>
  </div>

  <!-- C：水印版（超大淡箭头做底，文字居中压上） -->
  <div class="cv" data-shot="xianyu-bg-c-minimal">
    <svg class="mark" style="left:50%;transform:translateX(-50%);top:-60px;width:760px;height:760px;opacity:.10" viewBox="0 0 256 256">
      <path fill="#FFD24A" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
      <path fill="#D89A00" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
    </svg>
    <div style="position:absolute;left:0;right:0;top:132px;text-align:center">
      <div class="micro" style="color:#E0A93A">SPARK TEAM</div>
      <div class="h1" style="font-size:64px;margin-top:18px">游戏任务服务</div>
      <div class="sub" style="font-size:23px;margin-top:18px">可靠手打 · 纯绿服务 · 一号到底</div>
    </div>
    <div style="position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center;gap:12px">
      <div class="pill">按进度报价</div>
      <div class="pill">进度可查</div>
      <div class="pill">客服一对一</div>
    </div>
  </div>

</div>
</body>
</html>
