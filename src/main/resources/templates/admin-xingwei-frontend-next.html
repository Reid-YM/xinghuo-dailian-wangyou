<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#101216"/>
  <meta name="_csrf" th:content="${csrf.token}"/>
  <meta name="_csrf_header" th:content="${csrf.headerName}"/>
  <title>服务入口设置 · 星维管理后台</title>
  <link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261019cutover"/>
  <style>
    .fnr-shell{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:30px 0 64px}
    .fnr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}
    .fnr-top h1{margin:.2rem 0;font-size:clamp(27px,4vw,42px)}
    .fnr-top p{max-width:720px;color:var(--xw-muted,#8f97a2);line-height:1.75}
    .fnr-actions{display:flex;gap:8px;flex-wrap:wrap}
    .fnr-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:16px}
    .fnr-card{border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#11151a;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.24)}
    .fnr-card h2{margin:0 0 8px}.fnr-card p{color:#8e96a0;line-height:1.7;font-size:13px}
    .fnr-kicker{color:#d9b64e;font-size:11px;letter-spacing:.15em;font-weight:900;text-transform:uppercase}
    .fnr-current{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid rgba(255,203,45,.2);border-radius:12px;background:rgba(255,203,45,.05);margin:16px 0}
    .fnr-current strong{color:#ffcf38}.fnr-current code{color:#e9ebed}
    .fnr-field{display:grid;gap:7px;margin-top:15px}.fnr-field label{font-size:12px;font-weight:800}.fnr-field select{width:100%;min-height:46px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:#090d11;color:#edf0f2;padding:0 12px;outline:none}.fnr-field select:focus{border-color:#f5c536;box-shadow:0 0 0 3px rgba(245,197,54,.08)}
    .fnr-save{width:100%;margin-top:14px}.fnr-note{margin-top:12px;padding:12px;border-radius:11px;background:#0b0f13;border:1px solid rgba(255,255,255,.07);font-size:11px;color:#858d96;line-height:1.65}
    .fnr-message{min-height:20px;margin-top:10px;font-size:12px}.fnr-message.ok{color:#64db98}.fnr-message.error{color:#ff8f8f}
    .fnr-list{display:grid;gap:9px;margin-top:14px}.fnr-item{padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0c1014}.fnr-item b{display:block;margin-bottom:4px}.fnr-item span{font-size:11px;color:#858d96;line-height:1.55}
    .fnr-safe{color:#6ee2a1}.fnr-warn{color:#ffc768}
    @media(max-width:760px){.fnr-top{display:grid}.fnr-grid{grid-template-columns:1fr}.fnr-actions{width:100%}.fnr-actions .xw-button{flex:1}}
  </style>
<link rel="icon" href="/assets/brand-logo.svg?v=20261019admin" type="image/svg+xml"/>
<link rel="stylesheet" href="/assets/admin-device-layout.css?v=20261021devices1"/>
</head>
<body>
<main class="fnr-shell">
  <header class="fnr-top">
    <div>
      <div class="fnr-kicker"><img class="xw-inline-brand" src="/assets/brand-logo.svg?v=20261019admin" alt="星火"/> 星维管理后台</div>
      <h1>服务入口设置</h1>
      <p>设置页头、手机导航和页脚的服务入口。默认入口遵循网站统一版本设置，直达入口直接打开新版服务页。这里只调整导航。</p>
    </div>
    <div class="fnr-actions">
      <a class="xw-button xw-button-ghost" href="/admin/xingwei/frontend-controls">前台展示控制</a>
      <a class="xw-button xw-button-ghost" href="/admin/xingwei">返回新版后台</a>
      <span class="xw-muted">旧版已退役，公共页面统一使用新版</span>
      <a class="xw-button" href="/next/services" target="_blank" rel="noopener">预览新版</a>
    </div>
  </header>

  <section class="fnr-grid">
    <article class="fnr-card">
      <div class="fnr-kicker">入口设置</div>
      <h2>当前公共服务入口</h2>
      <div class="fnr-current">
        <span>当前模式</span>
        <strong id="rolloutModeLabel">读取中…</strong>
        <span id="rolloutHref">—</span>
      </div>

      <form id="frontendNextRolloutForm">
        <div class="fnr-field">
          <label for="servicesEntryMode">服务入口目标</label>
          <select id="servicesEntryMode" name="servicesEntryMode" disabled>
            <option value="legacy">默认服务入口</option>
            <option value="next">新版直达入口</option>
          </select>
        </div>
        <button class="xw-button fnr-save" type="submit" id="saveRolloutMode" disabled>保存入口目标</button>
        <button class="xw-button xw-button-ghost fnr-save" type="button" id="reloadRolloutMode">重新读取</button>
        <div class="fnr-message" id="rolloutMessage" role="status" aria-live="polite"></div>
      </form>

      <div class="fnr-note">
        保存会更新客户的导航入口。若其他人员已修改配置，请重新读取并核对后再保存；更改导航不会切换网站版本。
      </div>
    </article>

    <aside class="fnr-card">
      <div class="fnr-kicker">使用帮助</div>
      <h2>服务导航说明</h2>
      <div class="fnr-list">
        <div class="fnr-item"><b>默认入口</b><span>客户通过网站统一设置进入服务页。</span></div>
        <div class="fnr-item"><b>新版直达</b><span>服务导航直接打开新版服务页；旧版仍可单独预览。</span></div>
        <div class="fnr-item"><b>保存权限</b><span>拥有全站配置管理权限的人员可以修改入口。其他人员仅可查看。</span></div>
      </div>
    </aside>
  </section>
</main>
<script defer src="/assets/admin-frontend-next-rollout.js?v=20261020cutover"></script>
</body>
</html>
