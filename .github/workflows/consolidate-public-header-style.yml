name: Consolidate Public Header Style Ownership

on:
  push:
    branches:
      - refactor/public-css-ownership-20261012

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/public-css-ownership-20261012
          fetch-depth: 0

      - name: Move header quarantine into authoritative CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          css_path = Path('src/main/resources/static/assets/site-experience-v2.css')
          css = css_path.read_text(encoding='utf-8')
          css = replace_once(
              css,
              '-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.site-header .topbar',
              '-webkit-backdrop-filter:none!important;backdrop-filter:none!important;transition:none!important}.site-header .topbar',
              'header css quarantine')
          css_path.write_text(css, encoding='utf-8')

          fragment_path = Path('src/main/resources/templates/fragments/site.html')
          fragment = fragment_path.read_text(encoding='utf-8')
          fragment = replace_once(
              fragment,
              '<header th:fragment="header" class="site-header" data-experience-shell="v3" style="-webkit-backdrop-filter:none!important;backdrop-filter:none!important;transition:none!important">',
              '<header th:fragment="header" class="site-header" data-experience-shell="v3">',
              'inline header quarantine')
          fragment = replace_once(
              fragment,
              'site-experience-v2.css?v=20261007ux03',
              'site-experience-v2.css?v=20261012ux04',
              'experience css cache version')
          fragment_path.write_text(fragment, encoding='utf-8')

          responsive_path = Path('src/test/java/com/xinghuo/web/FrontendResponsivePlaywrightTest.java')
          responsive = responsive_path.read_text(encoding='utf-8')
          responsive = replace_once(
              responsive,
              'assertTrue(css.contains("-webkit-backdrop-filter:none!important"));',
              'assertTrue(css.contains("-webkit-backdrop-filter:none!important"));\n        assertTrue(css.contains("backdrop-filter:none!important;transition:none!important"));',
              'experience css transition contract')
          contract_pattern = re.compile(
              r'assertTrue\(fragment\.contains\("backdrop-filter:none!important;transition:none!important"\),\s*'
              r'"public v3 header must quarantine legacy blur transitions at the shell boundary"\);')
          responsive, count = contract_pattern.subn(
              'assertTrue(!fragment.contains("style=\\\"-webkit-backdrop-filter:none!important;backdrop-filter:none!important;transition:none!important\\\""),\n'
              '                "public v3 header must keep visual quarantine in the authoritative stylesheet, not inline markup");',
              responsive,
              count=1)
          if count != 1:
              raise SystemExit('missing anchor: responsive inline quarantine contract')
          responsive = replace_once(
              responsive,
              'site-experience-v2.css?v=20261007ux03',
              'site-experience-v2.css?v=20261012ux04',
              'responsive experience version')
          responsive_path.write_text(responsive, encoding='utf-8')

          style_test_path = Path('src/test/java/com/xinghuo/web/FrontendStyleLayerContractTest.java')
          style_test = style_test_path.read_text(encoding='utf-8')
          style_test = replace_once(
              style_test,
              'site-experience-v2.css?v=20261007ux03',
              'site-experience-v2.css?v=20261012ux04',
              'style layer experience version')
          anchor = '        assertFalse(site.contains("site-surface-refine.js"));\n'
          style_test = replace_once(
              style_test,
              anchor,
              anchor + '        assertFalse(site.contains("style=\\\"-webkit-backdrop-filter:none!important;backdrop-filter:none!important;transition:none!important\\\""));\n',
              'style layer inline quarantine guard')
          style_test_path.write_text(style_test, encoding='utf-8')

          Path('.github/workflows/consolidate-public-header-style.yml').unlink()
          PY

      - name: Commit ownership cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move public header quarantine into experience css"
          git push origin HEAD:refactor/public-css-ownership-20261012
