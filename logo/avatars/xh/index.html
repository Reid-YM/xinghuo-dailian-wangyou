<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星火团队 · XH 头像</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2A2F36;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .stack{display:flex;flex-wrap:wrap;gap:22px;padding:22px}
  .av{width:512px;height:512px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center}
  .ring{position:absolute;border-radius:50%;pointer-events:none}
  .mk{position:absolute;display:block}
  .abbr{position:absolute;left:0;right:0;text-align:center;font-weight:500;line-height:1}
  .micro{position:absolute;left:0;right:0;text-align:center;font-weight:600}
  .dark{background:#0A0C0F}
  .gold{background:#F5B700}
  .paper{background:#F7F8FA}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- 规范的上升双箭头：45°，上条厚 44 / 下条厚 28，整体 bbox 168x174 -->
  <symbol id="chev" viewBox="0 0 256 256">
    <path fill="currentColor" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
    <path fill="currentColor" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
  </symbol>
  <symbol id="chevTwo" viewBox="0 0 256 256">
    <path fill="#FFD24A" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
    <path fill="#D89A00" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
  </symbol>
</svg>

<div class="stack">

  <!-- 01 徽章：暗底 + 细金环 + 金箭头 + XH -->
  <div class="av dark" data-shot="xh-avatar-01-badge">
    <div class="ring" style="left:50px;top:50px;right:50px;bottom:50px;border:3px solid rgba(245,183,0,.42)"></div>
    <svg class="mk" style="left:161px;top:106px;width:190px;height:190px;color:#F5B700" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="abbr" style="color:#F5B700;font-size:64px;letter-spacing:16px;top:336px">XH</div>
  </div>

  <!-- 02 极简：只有箭头 + 小字 -->
  <div class="av dark" data-shot="xh-avatar-02-minimal">
    <svg class="mk" style="left:151px;top:92px;width:210px;height:210px;color:#F5B700" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="abbr" style="color:#98A1AD;font-size:50px;letter-spacing:22px;top:356px">XH</div>
  </div>

  <!-- 03 金底反黑 -->
  <div class="av gold" data-shot="xh-avatar-03-gold">
    <svg class="mk" style="left:161px;top:106px;width:190px;height:190px;color:#0A0C0F" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="abbr" style="color:#0A0C0F;font-size:64px;letter-spacing:16px;top:336px">XH</div>
  </div>

  <!-- 04 圆形满版 -->
  <div style="width:512px;height:512px;flex:none;display:grid;place-items:center" data-shot="xh-avatar-04-circle">
    <div style="width:512px;height:512px;border-radius:50%;background:#0A0C0F;position:relative;overflow:hidden">
      <div class="ring" style="left:46px;top:46px;right:46px;bottom:46px;border:3px solid rgba(245,183,0,.42)"></div>
      <svg class="mk" style="left:161px;top:106px;width:190px;height:190px;color:#F5B700" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
      <div class="abbr" style="color:#F5B700;font-size:64px;letter-spacing:16px;top:336px">XH</div>
    </div>
  </div>

  <!-- 05 浅底单色 -->
  <div class="av paper" data-shot="xh-avatar-05-light">
    <div class="ring" style="left:50px;top:50px;right:50px;bottom:50px;border:3px solid rgba(10,12,15,.18)"></div>
    <svg class="mk" style="left:161px;top:106px;width:190px;height:190px;color:#0A0C0F" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="abbr" style="color:#0A0C0F;font-size:64px;letter-spacing:16px;top:336px">XH</div>
  </div>

  <!-- 06 双色金属 + 极细环 + 微字 -->
  <div class="av dark" data-shot="xh-avatar-06-twotone">
    <div class="ring" style="left:44px;top:44px;right:44px;bottom:44px;border:2px solid rgba(245,183,0,.30)"></div>
    <svg class="mk" style="left:166px;top:104px;width:180px;height:180px" viewBox="0 0 256 256"><use href="#chevTwo" width="256" height="256"/></svg>
    <div class="abbr" style="color:#FFD24A;font-size:62px;letter-spacing:16px;top:340px">XH</div>
    <div class="micro" style="color:#6E7783;font-size:19px;letter-spacing:8px;top:428px">XINGHUO TEAM</div>
  </div>

  <!-- 07 高定：双细环 + 双色金属箭头 + 分隔线 + 全称微字 -->
  <div class="av dark" data-shot="xh-avatar-07-couture">
    <div class="ring" style="left:40px;top:40px;right:40px;bottom:40px;border:1.5px solid rgba(245,183,0,.30)"></div>
    <div class="ring" style="left:58px;top:58px;right:58px;bottom:58px;border:1.5px solid rgba(245,183,0,.12)"></div>
    <svg class="mk" style="left:166px;top:98px;width:180px;height:180px" viewBox="0 0 256 256"><use href="#chevTwo" width="256" height="256"/></svg>
    <div class="abbr" style="color:#FFD24A;font-size:60px;letter-spacing:20px;top:320px">XH</div>
    <div style="position:absolute;left:196px;right:196px;top:404px;height:1px;background:rgba(245,183,0,.30)"></div>
    <div class="micro" style="color:#8D96A3;font-size:18px;letter-spacing:9px;top:424px">XINGHUO TEAM</div>
  </div>

</div>
</body>
</html>
