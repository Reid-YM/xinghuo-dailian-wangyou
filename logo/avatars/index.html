<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星火网游 · 头像</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .stack{display:flex;flex-wrap:wrap;gap:20px;padding:20px}
  .av{width:512px;height:512px;flex:none;display:grid;place-items:center;position:relative;overflow:hidden}
  .av .mk{display:block}
  .av .tag{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-weight:700;letter-spacing:.28em}
  .dark{background:#0A0C0F}
  .gold{background:#F5B700}
  .orange{background:#FF5000}
  .yellow{background:#FFE411}
  .green{background:#1AAD19}
  .char{font-weight:800;line-height:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tiers" viewBox="0 0 256 256">
    <rect x="29" y="164" width="36" height="62" rx="18" fill="#D89A00"/>
    <rect x="83" y="120" width="36" height="106" rx="18" fill="#F0B000"/>
    <rect x="137" y="76" width="36" height="150" rx="18" fill="#FFC928"/>
    <rect x="191" y="32" width="36" height="194" rx="18" fill="#FFD24A"/>
  </symbol>
  <symbol id="tiersMono" viewBox="0 0 256 256">
    <g fill="currentColor">
      <rect x="29" y="164" width="36" height="62" rx="18"/>
      <rect x="83" y="120" width="36" height="106" rx="18"/>
      <rect x="137" y="76" width="36" height="150" rx="18"/>
      <rect x="191" y="32" width="36" height="194" rx="18"/>
    </g>
  </symbol>
  <symbol id="xmark" viewBox="0 0 256 256">
    <path fill="currentColor" d="M40 40 H88 L128 88 L168 40 H216 V88 L168 128 L216 168 V216 H168 L128 168 L88 216 H40 V168 L88 128 L40 88 Z"/>
  </symbol>
</svg>

<div class="stack">

  <div class="av dark" data-shot="avatar-01-dark-gold">
    <svg class="mk" style="width:300px;height:300px" viewBox="0 0 256 256"><use href="#tiers" width="256" height="256"/></svg>
  </div>

  <div class="av gold" data-shot="avatar-02-gold-ink">
    <svg class="mk" style="width:300px;height:300px;color:#0A0C0F" viewBox="0 0 256 256"><use href="#tiersMono" width="256" height="256"/></svg>
  </div>

  <div class="av dark" data-shot="avatar-03-xmark">
    <svg class="mk" style="width:280px;height:280px;color:#F5B700" viewBox="0 0 256 256"><use href="#xmark" width="256" height="256"/></svg>
  </div>

  <div class="av dark" data-shot="avatar-04-support">
    <svg class="mk" style="width:210px;height:210px" viewBox="0 0 256 256"><use href="#tiers" width="256" height="256"/></svg>
    <div class="tag" style="color:#FFC928;font-size:44px">客服</div>
  </div>

  <div class="av orange" data-shot="avatar-05-taobao">
    <svg class="mk" style="width:300px;height:300px;color:#FFFFFF" viewBox="0 0 256 256"><use href="#tiersMono" width="256" height="256"/></svg>
  </div>

  <div class="av yellow" data-shot="avatar-06-xianyu">
    <svg class="mk" style="width:300px;height:300px;color:#0A0C0F" viewBox="0 0 256 256"><use href="#tiersMono" width="256" height="256"/></svg>
  </div>

  <div class="av green" data-shot="avatar-07-wechat">
    <svg class="mk" style="width:300px;height:300px;color:#FFFFFF" viewBox="0 0 256 256"><use href="#tiersMono" width="256" height="256"/></svg>
  </div>

  <div class="av dark" data-shot="avatar-08-char">
    <div class="char" style="color:#F5B700;font-size:300px">火</div>
  </div>

</div>
</body>
</html>
