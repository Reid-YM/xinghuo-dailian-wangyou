<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"/><meta name="robots" content="noindex,nofollow"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>操作审计 · 星维管理后台</title><link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261013v1"/><link rel="stylesheet" href="/assets/admin-xingwei-channels.css?v=20261016v4n"/>
</head><body><main class="xwc-shell">
<header class="xwc-header"><div><p class="xw-kicker">星维 · 操作审计</p><h1>操作审计</h1><p>按操作人、业务对象与日期定位变更记录。</p></div><a class="xw-button xw-button-ghost" href="/admin/xingwei">返回后台</a></header>
<p class="xwc-note">只展示当前权限范围内的操作记录与变更摘要。密钥、口令、完整客户资料及原始变更内容不在此页展示。日期范围按北京时间计算。</p>
<form id="auditFilters" class="xwc-filters"><label class="xwc-search">搜索<input name="q" maxlength="80" placeholder="操作人、业务对象或请求编号"/></label><label>操作类型<select name="action"><option value="">全部类型</option></select></label><label>开始日期<input name="from" type="date"/></label><label>结束日期<input name="to" type="date"/></label><button class="xw-button" type="submit">查询</button><button id="auditRefresh" class="xw-button xw-button-ghost" type="button">刷新</button></form>
<p id="auditMessage" role="status" aria-live="polite">正在读取审计记录…</p><button id="auditRetry" class="xw-button xw-button-ghost" type="button" hidden>重新读取</button><p id="auditCount"></p><section id="auditRows" class="xwc-list" aria-label="操作记录" aria-busy="true"></section>
<nav class="xwc-pagination" aria-label="审计分页"><button id="auditPrev" class="xw-button xw-button-ghost" type="button" disabled>上一页</button><span id="auditPage">第 1 页</span><button id="auditNext" class="xw-button xw-button-ghost" type="button" disabled>下一页</button></nav>
<dialog id="auditDialog"><div class="xwc-heading"><h2>变更摘要</h2><button id="auditClose" type="button" class="xw-button xw-button-ghost">关闭</button></div><p id="auditDetailMessage" role="status" aria-live="polite"></p><div id="auditDetail"></div><button id="auditDetailRetry" class="xw-button xw-button-ghost" type="button" hidden>重新读取摘要</button></dialog>
</main><script defer src="/assets/admin-xingwei-labels.js?v=20261016cn1"></script><script src="/assets/admin-xingwei-audits.js?v=20261016audit1" defer></script></body></html>
