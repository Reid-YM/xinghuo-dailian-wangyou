<body class="camo-tracker-body" data-page="mw4-camo-tracker">
<header th:replace="~{fragments/site :: header}"></header>

<main class="container camo-shell">
  <section class="camo-hero" aria-labelledby="camoTitle">
    <div class="camo-hero-copy">
      <span class="eyebrow">MW4 · CAMO TRACKER</span>
      <h1 id="camoTitle">迷彩进度，一页看清</h1>
      <p>多人、战区、DMZ 分开记录每把武器的迷彩解锁。进度自动保存在当前设备，不需要登录；收藏和筛选可以快速找到还没完成的项目。</p>
      <div class="camo-hero-actions">
        <a class="btn primary" href="/quote?toolProgress=1&amp;gameCode=CODMW4" id="quoteWithProgress" data-primary-cta>带着进度询价</a>
        <a class="btn ghost" href="/service/camo-task">查看迷彩服务</a>
      </div>
    </div>
    <div class="camo-overall" aria-live="polite">
      <span>总完成度</span>
      <strong id="overallPercent">0%</strong>
      <div class="camo-overall-track"><i id="overallBar"></i></div>
      <p><b id="overallCount">0 / 0</b> 项迷彩进度已记录</p>
      <small id="saveState">进度会自动保存在当前浏览器</small>
    </div>
  </section>

  <section class="camo-mode-section" aria-label="迷彩模式">
    <div class="camo-mode-tabs" id="modeTabs"></div>
    <div class="camo-mode-summary" id="modeSummary"></div>
  </section>

  <section class="camo-filter-panel" aria-label="筛选武器">
    <label>
      <span>武器类型</span>
      <select id="classFilter"><option value="">全部类型</option></select>
    </label>
    <label>
      <span>完成状态</span>
      <select id="statusFilter">
        <option value="all">全部武器</option>
        <option value="todo">未完成</option>
        <option value="done">已完成</option>
        <option value="fav">已收藏</option>
      </select>
    </label>
    <label class="camo-search-field">
      <span>搜索武器</span>
      <input id="weaponSearch" type="search" placeholder="输入武器名称或代号" autocomplete="off">
    </label>
    <div class="camo-filter-actions">
      <button class="btn ghost" id="resetProgress" type="button">清空当前模式</button>
      <button class="btn ghost" id="clearFavorites" type="button">清空收藏</button>
    </div>
  </section>

  <div id="trackerStatus" class="camo-status" role="status">正在读取 MW4 武器资料…</div>
  <section class="camo-groups" id="weaponGroups"></section>
  <div class="camo-empty hidden" id="emptyState">
    <b>没有符合条件的武器</b>
    <span>调整搜索、类型或完成状态后再试。</span>
  </div>

  <section class="camo-note">
    <div>
      <span class="eyebrow">工具说明</span>
      <h2>先记录剩余项目，再决定要不要把时间交给别人</h2>
      <p>工具只记录勾选进度，不会上传游戏账号、密码或验证码。进度保存在当前浏览器，清空浏览器数据会同时清除本机记录。</p>
    </div>
    <a class="btn ghost" href="/contact">联系客服确认服务</a>
  </section>
</main>

<nav class="mobile-dock" aria-label="手机快捷操作">
  <a class="active" href="/mastery">MW4 迷彩</a>

</nav>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
