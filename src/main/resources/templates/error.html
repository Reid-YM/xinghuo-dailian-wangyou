<!doctype html>

<head>

<body data-page="error">
<header th:replace="~{fragments/site :: header}"></header>
<main class="container section page-shell error-page">
  <section class="card rules-console" style="max-width:640px;margin:0 auto;text-align:center">
    <span class="eyebrow" th:text="${statusLabel}">404</span>
    <h1 th:text="${statusTitle}">页面未找到</h1>
    <p class="muted" th:text="${statusMessage}">这个地址没有对应内容。</p>

      <a class="btn ghost" href="/services">服务大厅</a>
      <a class="btn ghost" href="/contact">联系客服</a>
    </div>
    <p class="muted" style="margin-top:18px"><a href="/records">查询业务进度</a> · <a href="/mastery">MW4 工具站</a></p>
    <p class="muted" th:if="${requestId}" style="font-size:12px">如联系客服，请提供请求编号：<b th:text="${requestId}">-</b></p>
  </section>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
