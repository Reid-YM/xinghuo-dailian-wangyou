<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><meta name="_csrf" th:content="${csrf.token}"/><meta name="_csrf_header" th:content="${csrf.headerName}"/><title>目录完整资料 · 星维后台</title><link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261013v1"/><link rel="stylesheet" href="/assets/admin-xingwei-integrations.css?v=20261014v3p"/><link rel="stylesheet" href="/assets/admin-xingwei-catalog-details.css?v=20261016details1"/><script defer src="/assets/admin-xingwei-labels.js?v=20261016cn1"></script><script defer src="/assets/admin-xingwei-catalog-details.js?v=20261016cn1"></script></head><body><main class="xwi-shell"><header class="xwi-top"><div><p class="xw-kicker">目录完整资料</p><h1>目录完整资料</h1><p>维护封面、有效期、游戏资料、搜索展示与平台。启用仍通过目录的发布/影响检查。</p></div><div class="xwi-actions"><a class="xw-button" href="/admin/xingwei/catalog">服务与发布</a><a class="xw-button" href="/admin/xingwei/taxonomy">游戏与分类启停</a><a class="xw-button xw-button-ghost" href="/admin/xingwei">返回后台</a></div></header>
