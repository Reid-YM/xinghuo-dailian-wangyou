<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><meta name="_csrf" th:content="${csrf.token}"/><meta name="_csrf_header" th:content="${csrf.headerName}"/><title>会员与运营工作台 · 星维后台</title><link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261019cutover"/><link rel="stylesheet" href="/assets/admin-xingwei-channels.css?v=20261016ops1"/><link rel="stylesheet" href="/assets/admin-xingwei-operations.css?v=20261016ops1"/><script defer src="/assets/admin-xingwei-labels.js?v=20261017search1"></script><script defer src="/assets/admin-xingwei-operations.js?v=20261020fields"></script><link rel="icon" href="/assets/brand-logo.svg?v=20261019admin" type="image/svg+xml"/>
</head><body><main class="xwc-shell">
<header class="xwc-header"><div><p class="xw-kicker"><img class="xw-workspace-logo" src="/assets/brand-logo.svg?v=20261019admin" alt="" width="26" height="26"/> 会员与运营</p><h1>会员与运营工作台</h1><p>网站会员、社区审核、测试反馈、首页展示位和客户线索。</p></div><a class="xw-button xw-button-ghost" href="/admin/xingwei">返回新版后台</a></header>
