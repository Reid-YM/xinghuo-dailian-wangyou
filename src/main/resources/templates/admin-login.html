<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141b"><title>星维后台登录 - 星火网游代练平台</title><link rel="stylesheet" href="/assets/admin-xingwei.css?v=20261016cn1"><link rel="stylesheet" href="/assets/admin-xingwei-login.css?v=20261016audit2"><link rel="icon" href="/assets/brand-logo.svg?v=20261019admin" type="image/svg+xml"/>
</head>
<body class="xw-login"><main class="xw-login-shell"><section class="xw-login-card" aria-labelledby="loginTitle"><a class="xw-login-brand" href="/"><img src="/assets/brand-logo.svg?v=20261008logo02" width="36" height="36" alt="">星火网游代练平台</a><p class="xw-login-kicker">星维运营工作台</p><h1 id="loginTitle">登录新版后台</h1><p class="xw-login-description">使用已授权的后台账号登录，按岗位权限处理业务和站点内容。</p><div th:if="${param.error}" class="xw-login-notice error" role="alert">账号或密码错误，请重新输入。</div><div th:if="${param.logout}" class="xw-login-notice" role="status">已安全退出后台。</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">登录后台</button></form></section></main></body></html>
