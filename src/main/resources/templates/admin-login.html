<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>运营管理中心登录 - 星火网游代练平台</title><link rel="icon" href="/assets/brand-logo.svg?v=20261008logo02" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="/assets/app.css?v=20261005v031"><link rel="stylesheet" href="/assets/admin-light-theme.css?v=20261007l001"><link rel="stylesheet" href="/assets/admin-brand-layout-fixes.css?v=20261008b002"></head>
<body class="admin-login-ui"><main class="login"><div class="card"><div class="brand brand-mark"><span class="brand-dot"></span>星火网游代练平台</div><h1>运营管理中心</h1><p class="muted">登录后管理站点设置、服务项目、询价线索、履约订单、服务分类与首页推荐位。</p><div th:if="${param.error}" class="notice error">账号或密码错误</div><div th:if="${param.logout}" class="notice">已安全退出后台</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">密码</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">进入运营管理中心</button></form></div></main></body></html>
