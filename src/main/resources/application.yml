server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
spring:
  web:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:xinghuo_v2}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:xinghuo}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:5}MB
      max-request-size: ${MAX_UPLOAD_MB:5}MB
  thymeleaf:
    cache: true
logging:
  level:
    root: INFO
    org.springframework.security: INFO
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  upload-dir: ${UPLOAD_DIR:./uploads}
  max-upload-mb: ${MAX_UPLOAD_MB:5}
  wechat-login:
    app-id: ${WECHAT_OPEN_APP_ID:}
    app-secret: ${WECHAT_OPEN_APP_SECRET:}
  wechat-mini:
    app-id: ${WECHAT_MINI_APP_ID:}
    app-secret: ${WECHAT_MINI_APP_SECRET:}
  wechat-pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    app-id: ${WECHAT_PAY_APP_ID:}
    merchant-serial: ${WECHAT_PAY_MERCHANT_SERIAL:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  defaults:
    wechat-id: ${DEFAULT_WECHAT_ID:}
    qq-id: ${DEFAULT_QQ_ID:}

# 企业微信通讯录与待验收的人事写入。Secret 仅来自服务器环境变量。
wecom:
  corp-id: ${WECOM_CORP_ID:}
  app-secret: ${WECOM_APP_SECRET:}
  contact-secret: ${WECOM_SECRET:}
