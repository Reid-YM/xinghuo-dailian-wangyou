  <meta property="og:type" content="website"><meta property="og:site_name" content="星火网游代练平台"><meta property="og:title" content="服务项目 - 星火网游代练平台"><meta property="og:description" content="浏览当前可接的游戏任务服务。"><meta property="og:url" content="https://wydlgf.cn/services"><meta property="og:image" content="https://wydlgf.cn/og.png">

<header class="site-header"><div class="container topbar"><a class="brand brand-mark" href="/"><span class="brand-dot"></span><span data-config="brandName">星火网游代练平台</span></a><nav class="nav" aria-label="主导航"><a href="/services">服务</a><a href="/mastery">MW4 工具站</a><a href="/records">业务记录</a><a href="/contact">一对一咨询</a><a class="btn primary desktop-keep" href="/quote">立即询价</a></nav></div></header>
<main class="container section page-shell services-browser">
  <div class="page-hero page-hero-compact service-browser-hero"><div><div class="service-state" data-config="status">● MW4 正式版预约中 · 上线后陆续开放服务</div><span class="eyebrow">服务大厅</span><h1>CODMW4 当前奖励代练</h1><p class="page-hero-note">可靠手打 · 纯绿服务 · 进度可查 · 下单前确认需求</p></div><div class="page-hero-actions"><a class="btn primary" href="/quote" data-primary-cta>提前询价</a></div></div>
  <section class="service-browser-console" aria-label="服务筛选">
    <div class="service-browser-search"><span class="search-icon" aria-hidden="true">⌕</span><input id="publicServiceSearch" type="search" placeholder="搜索游戏或服务" autocomplete="off"></div>
    <div class="browser-row"><span class="browser-label">游戏</span><div id="publicGameFilters" class="filters game-filter-rail"><button class="filter-btn active" data-game-filter="all">全部游戏</button></div></div>
    <div class="browser-row"><span class="browser-label">平台</span><div id="publicPlatformFilters" class="filters platform-filter-rail"><button class="filter-btn active" data-platform-filter="all">全部平台</button></div></div>
    <div class="browser-row"><span class="browser-label">需求</span><div id="publicCategoryFilters" class="filters service-filterbar"><button class="filter-btn active" data-category-filter="all">全部需求</button></div></div>
    <div class="service-browser-summary" id="publicServiceSummary">正在读取服务…</div>
  </section>
  <div id="list" class="grid4 section service-browser-grid">
    <a class="service-card card" th:each="svc : ${hallServices}" th:href="@{'/service/' + ${svc.slug}}" th:attr="data-game-code=${svc.gameCode},data-category=${svc.category}">
        <div class="service-cover" th:if="${svc.coverImage != null}"><img th:src="${svc.coverImage}" th:alt="|服务封面：${svc.name}|" loading="lazy" decoding="async"></div>
        <div class="service-card-head"><span class="tag" th:text="${svc.gameCode == 'CODMW4' ? '使命召唤 MW4' : (svc.gameCode == 'WAR_DOGS' ? '战狗' : svc.name)}">游戏服务</span><span class="availability" th:text="${acceptingOrders and svc.status.name() == 'AVAILABLE' ? '可接单' : (svc.status.name() == 'OFFLINE' ? '已下架' : '可预约')}">可预约</span></div>
        <h3 th:text="${svc.name}">服务名称</h3>
        <p class="muted clamp2" th:text="${svc.shortDesc}">服务说明</p>
        <div class="service-card-facts"><span><b>平台</b><i th:text="${svc.gameCode == 'CODMW4' ? 'Steam / PS / Xbox / Switch 2' : (svc.gameCode == 'WAR_DOGS' ? 'Steam' : '按平台确认')}">多平台确认</i></span><span><b>服务</b><i>手打 · 纯绿 · 进度可查</i></span><span><b>适合</b><i>按当前进度与目标奖励确认</i></span></div>
        <div class="service-meta"><strong th:text="${svc.priceMin != null ? '参考 ¥' + svc.priceMin + ' 起' : '人工报价'}">参考价</strong><span th:text="${svc.durationText}">按进度确认</span></div>
        <div class="service-card-action"><span>查看详情</span><span>咨询 / 下单 →</span></div>
      </a>
  </div>
</main>
