name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/deploy-zero-downtime.sh scripts/deploy-from-github.sh scripts/github-deploy-gateway.sh scripts/install-github-deploy-bridge.sh scripts/smoke_test.sh

      - name: Build and test with Maven
        run: mvn -B -ntp clean package

      - name: Prepare main build artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one JAR in target/, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          artifact="xinghuo-v2-${GITHUB_SHA}.jar"
          cp "${jars[0]}" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Upload main build artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xinghuo-v2-${{ github.sha }}
          path: |
            xinghuo-v2-${{ github.sha }}.jar
            xinghuo-v2-${{ github.sha }}.jar.sha256
          if-no-files-found: error
          retention-days: 30
