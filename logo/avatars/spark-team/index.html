<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Spark Team · 头像</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2A2F36;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .stack{display:flex;flex-wrap:wrap;gap:22px;padding:22px}
  .av{width:512px;height:512px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center}
  .mk{position:absolute;display:block}
  .word{position:absolute;left:0;right:0;text-align:center;font-weight:500;line-height:1;white-space:nowrap}
  .rule{position:absolute;height:1px}
  .dark{background:#0A0C0F}
  .gold{background:#F5B700}
  .paper{background:#F7F8FA}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- 规范几何：统一 45°，上条厚 44 / 下条厚 28，bbox 168x174 -->
  <symbol id="chev" viewBox="0 0 256 256">
    <path fill="currentColor" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
    <path fill="currentColor" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
  </symbol>
  <symbol id="chevTwo" viewBox="0 0 256 256">
    <path fill="#FFD24A" d="M44 125 L128 41 L212 125 L212 169 L128 85 L44 169 Z"/>
    <path fill="#D89A00" d="M76 187 L128 135 L180 187 L180 215 L128 163 L76 215 Z"/>
  </symbol>
</svg>

<div class="stack">

  <!-- 01 主版：深底 + 双色金属箭头 + SPARK TEAM -->
  <div class="av dark" data-shot="sparkteam-01-dark">
    <svg class="mk" style="left:168px;top:118px;width:176px;height:176px" viewBox="0 0 256 256"><use href="#chevTwo" width="256" height="256"/></svg>
    <div class="word" style="color:#FFD24A;font-size:44px;letter-spacing:10px;top:344px">SPARK TEAM</div>
  </div>

  <!-- 02 单色金箭头 -->
  <div class="av dark" data-shot="sparkteam-02-solid">
    <svg class="mk" style="left:168px;top:118px;width:176px;height:176px;color:#F5B700" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="word" style="color:#F5B700;font-size:44px;letter-spacing:10px;top:344px">SPARK TEAM</div>
  </div>

  <!-- 03 金底反黑 -->
  <div class="av gold" data-shot="sparkteam-03-gold">
    <svg class="mk" style="left:168px;top:118px;width:176px;height:176px;color:#0A0C0F" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="word" style="color:#0A0C0F;font-size:44px;letter-spacing:10px;top:344px">SPARK TEAM</div>
  </div>

  <!-- 04 浅底单色 -->
  <div class="av paper" data-shot="sparkteam-04-light">
    <svg class="mk" style="left:168px;top:118px;width:176px;height:176px;color:#0A0C0F" viewBox="0 0 256 256"><use href="#chev" width="256" height="256"/></svg>
    <div class="word" style="color:#0A0C0F;font-size:44px;letter-spacing:10px;top:344px">SPARK TEAM</div>
  </div>

  <!-- 05 圆形满版（无环） -->
  <div style="width:512px;height:512px;flex:none;display:grid;place-items:center" data-shot="sparkteam-05-circle">
    <div style="width:512px;height:512px;border-radius:50%;background:#0A0C0F;position:relative;overflow:hidden">
      <svg class="mk" style="left:168px;top:102px;width:176px;height:176px" viewBox="0 0 256 256"><use href="#chevTwo" width="256" height="256"/></svg>
      <div class="word" style="color:#FFD24A;font-size:42px;letter-spacing:9px;top:326px">SPARK TEAM</div>
    </div>
  </div>

  <!-- 06 带细分隔线（可选） -->
  <div class="av dark" data-shot="sparkteam-06-rule">
    <svg class="mk" style="left:168px;top:104px;width:176px;height:176px" viewBox="0 0 256 256"><use href="#chevTwo" width="256" height="256"/></svg>
    <div class="word" style="color:#FFD24A;font-size:42px;letter-spacing:9px;top:330px">SPARK TEAM</div>
    <div class="rule" style="left:196px;right:196px;top:412px;background:rgba(245,183,0,.32)"></div>
  </div>

</div>
</body>
</html>
