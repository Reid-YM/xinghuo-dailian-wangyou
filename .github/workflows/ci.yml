name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Maven Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Safety net: main pushes must come from a merged PR.
      - name: Guard main against direct pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          prs=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")

          echo "$prs" | jq -e --arg sha "$GITHUB_SHA" '
            any(.[];
              .merged_at != null
              and .base.ref == "main"
              and .merge_commit_sha == $sha
            )
          ' >/dev/null || {
            echo "::error::Direct push to main detected. This guard only accepts commits merged into main through a GitHub Pull Request."
            exit 1
          }

          echo "PASS: main commit came from a merged Pull Request."

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/deploy-zero-downtime.sh scripts/deploy-from-github.sh scripts/github-deploy-gateway.sh scripts/install-github-deploy-bridge.sh scripts/smoke_test.sh

      - name: Build and test with Maven
        run: mvn -B -ntp clean package

      - name: Prepare main build artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one JAR in target/, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          artifact="xinghuo-v2-${GITHUB_SHA}.jar"
          cp "${jars[0]}" "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"

      # Production deploy builds from the verified main SHA on the server and does not consume this
      # convenience artifact. Keep the upload best-effort so a repository storage-quota incident
      # cannot turn an otherwise successful build/test run red or block the deploy gate.
      - name: Upload main build artifact
        id: upload-main-artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xinghuo-v2-${{ github.sha }}
          path: |
            xinghuo-v2-${{ github.sha }}.jar
            xinghuo-v2-${{ github.sha }}.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Report artifact upload warning
        if: steps.upload-main-artifact.outcome == 'failure'
        shell: bash
        run: echo '::warning::Build and tests passed, but the optional GitHub build artifact could not be uploaded. Check Actions artifact storage quota.'

  frontend-ui:
    name: Chromium + WebKit UI Regression
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Compile UI regression tests
        run: mvn -B -ntp -DskipTests test-compile

      - name: Install Playwright Chromium and WebKit
        run: >-
          mvn -B -ntp org.codehaus.mojo:exec-maven-plugin:3.6.2:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium webkit"

      - name: Run all browser interaction regression tests
        env:
          PLAYWRIGHT_UI_TESTS: '1'
        run: mvn -B -ntp -Dtest='*PlaywrightTest' test

      - name: Print UI regression diagnostics
        if: failure()
        shell: bash
        run: |
          echo '===== Surefire reports ====='
          find target/surefire-reports -maxdepth 1 -type f -print 2>/dev/null || true
          for report in target/surefire-reports/*.txt; do
            [ -f "$report" ] || continue
            echo "===== $report ====="
            cat "$report"
          done

      - name: Upload UI regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-regression-diagnostics-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
